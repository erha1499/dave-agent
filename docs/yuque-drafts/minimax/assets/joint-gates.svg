<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410"><rect width="1100" height="410" fill="#f6f8fb"/><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#192d42}.title{font-size:28px;font-weight:600}.head{font-size:21px;font-weight:600}.body{font-size:17px}</style><text x="38" y="55" class="title">联合验收的顺序与停止条件</text><text x="38" y="94" class="body">冻结 → 执行 → 审阅 → 判定；每一阶段保留未完成状态</text><rect x="38" y="134" width="232" height="180" rx="14" fill="white" stroke="#94acbf"/><text x="54" y="174" class="head">冻结合同</text><text x="54" y="210" class="body">场景与完整分母</text><text x="54" y="240" class="body">源码 / 配置 / 标准</text><text x="54" y="270" class="body">请求与时间上限</text><rect x="298" y="134" width="232" height="180" rx="14" fill="white" stroke="#94acbf"/><text x="314" y="174" class="head">执行并保存</text><text x="314" y="210" class="body">工程与模型分开</text><text x="314" y="240" class="body">最终回复绑定轨迹</text><text x="314" y="270" class="body">失败 / 缺失保留</text><rect x="558" y="134" width="232" height="180" rx="14" fill="white" stroke="#94acbf"/><text x="574" y="174" class="head">逐条件审阅</text><text x="574" y="210" class="body">核对原文与哈希</text><text x="574" y="240" class="body">保存每条理由</text><text x="574" y="270" class="body">标清审阅人身份</text><rect x="818" y="134" width="232" height="180" rx="14" fill="white" stroke="#94acbf"/><text x="834" y="174" class="head">结果与收尾</text><text x="834" y="210" class="body">同时做对和说对</text><text x="834" y="240" class="body">报告成本完整性</text><text x="834" y="270" class="body">预算到即归档</text><text x="38" y="368" class="body">Codex 辅助审阅不等于真人签收；旧题修复后需要新的独立验收。</text></svg>