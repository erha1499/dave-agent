<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410"><rect width="1100" height="410" fill="#f6f8fb"/><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#192d42}.title{font-size:28px;font-weight:600}.head{font-size:21px;font-weight:600}.body{font-size:17px}</style><text x="38" y="55" class="title">一个任务，四份相互关联的证据</text><text x="38" y="94" class="body">相同运行版本 / 案例 / 轮次 / 回复哈希 / 评分标准哈希</text><rect x="38" y="134" width="232" height="180" rx="14" fill="white" stroke="#94acbf"/><text x="54" y="174" class="head">最终公开回复</text><text x="54" y="210" class="body">事实有依据</text><text x="54" y="240" class="body">必要条件完整</text><text x="54" y="270" class="body">没有错误承诺</text><rect x="298" y="134" width="232" height="180" rx="14" fill="white" stroke="#94acbf"/><text x="314" y="174" class="head">工具轨迹</text><text x="314" y="210" class="body">当前身份与范围</text><text x="314" y="240" class="body">本轮重新取证</text><text x="314" y="270" class="body">调用与失败可追溯</text><rect x="558" y="134" width="232" height="180" rx="14" fill="white" stroke="#94acbf"/><text x="574" y="174" class="head">持久状态</text><text x="574" y="210" class="body">确认后才执行</text><text x="574" y="240" class="body">金额和券状态一致</text><text x="574" y="270" class="body">重复请求仍一笔</text><rect x="818" y="134" width="232" height="180" rx="14" fill="white" stroke="#94acbf"/><text x="834" y="174" class="head">HTTP 与费用</text><text x="834" y="210" class="body">重试同样计数</text><text x="834" y="240" class="body">usage 覆盖可核对</text><text x="834" y="270" class="body">未知费用不补零</text><text x="38" y="368" class="body">工具执行正确，不足以证明答复正确；合成退款成功，不等于真实资金到账。</text></svg>