<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420"><rect width="1100" height="420" fill="#f6f8fb"/><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#192d42}.title{font-size:28px;font-weight:600}.head{font-size:21px;font-weight:600}.body{font-size:17px}</style><text x="38" y="55" class="title">上下文测量：四种数字各有用途</text><text x="38" y="94" class="body">实际发出前检查完整 body；账本只留数值与固定原因，不保存用户原文。</text><rect x="38" y="134" width="232" height="180" rx="14" fill="white" stroke="#94acbf"/><text x="54" y="174" class="head">完整请求字节</text><text x="54" y="210" class="body">系统 / 历史 / 工具</text><text x="54" y="240" class="body">本轮输入 / 工具结果</text><text x="54" y="270" class="body">最终序列化后测量</text><rect x="298" y="134" width="232" height="180" rx="14" fill="white" stroke="#94acbf"/><text x="314" y="174" class="head">本地预算</text><text x="314" y="210" class="body">输入字节 + 输出预留</text><text x="314" y="240" class="body">加上固定安全余量</text><text x="314" y="270" class="body">超过限额即拒发</text><rect x="558" y="134" width="232" height="180" rx="14" fill="white" stroke="#94acbf"/><text x="574" y="174" class="head">SDK 上下文估计</text><text x="574" y="210" class="body">会话投影估计</text><text x="574" y="240" class="body">可能为空，单独记录</text><text x="574" y="270" class="body">不能代替完整检查</text><rect x="818" y="134" width="232" height="180" rx="14" fill="white" stroke="#94acbf"/><text x="834" y="174" class="head">供应商实际用量</text><text x="834" y="210" class="body">响应报告的 usage</text><text x="834" y="240" class="body">输入 / 输出 / 缓存</text><text x="834" y="270" class="body">缺失继续记 unknown</text><text x="38" y="366" class="body">本地预算单位不是精确 Token；模型目录窗口也不是远端容量承诺。</text></svg>