<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420"><rect width="1100" height="420" fill="#f6f8fb"/><style>text{font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif;fill:#192d42} .title{font-size:28px;font-weight:600} .heading{font-size:21px;font-weight:600} .small{font-size:17px}</style><text x="38" y="58" class="title">模型、Harness、工具与业务服务的边界</text><text x="38" y="96" class="small">每层都承担具体职责，不能用上一层的承诺代替下一层的检查</text><rect x="38" y="138" width="232" height="182" rx="14" fill="white" stroke="#94acbf"/><text x="54" y="180" class="heading">模型</text><text x="54" y="217" class="small">理解与提出行动</text><text x="54" y="246" class="small">输出工具参数</text><text x="54" y="275" class="small">无法授予业务权限</text><path d="M 273 230 h 17 l -5 -5 m 5 5 l -5 5" fill="none" stroke="#276c9c" stroke-width="2"/><rect x="298" y="138" width="232" height="182" rx="14" fill="white" stroke="#94acbf"/><text x="314" y="180" class="heading">Harness</text><text x="314" y="217" class="small">会话与执行循环</text><text x="314" y="246" class="small">工具生命周期</text><text x="314" y="275" class="small">审批 / 恢复 / 记录</text><path d="M 533 230 h 17 l -5 -5 m 5 5 l -5 5" fill="none" stroke="#276c9c" stroke-width="2"/><rect x="558" y="138" width="232" height="182" rx="14" fill="white" stroke="#94acbf"/><text x="574" y="180" class="heading">工具边界</text><text x="574" y="217" class="small">Schema 校验</text><text x="574" y="246" class="small">可信身份注入</text><text x="574" y="275" class="small">只开放必要操作</text><path d="M 793 230 h 17 l -5 -5 m 5 5 l -5 5" fill="none" stroke="#276c9c" stroke-width="2"/><rect x="818" y="138" width="232" height="182" rx="14" fill="white" stroke="#94acbf"/><text x="834" y="180" class="heading">业务服务</text><text x="834" y="217" class="small">重新授权读取</text><text x="834" y="246" class="small">金额 / 确认 / 事务</text><text x="834" y="275" class="small">幂等与持久查询</text><text x="38" y="373" class="small">沙箱限制进程能做什么；业务授权限制这个用户能对这笔订单做什么。</text></svg>