<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420"><rect width="1100" height="420" fill="#f6f8fb"/><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#192d42}.title{font-size:28px;font-weight:600}.head{font-size:21px;font-weight:600}.body{font-size:17px}</style><text x="38" y="55" class="title">超限后的恢复：停止旧轮，重新说明</text><text x="38" y="94" class="body">不删业务结果、不重做工具、不继承聊天许可；不会声称已自动压缩。</text><rect x="38" y="134" width="232" height="180" rx="14" fill="white" stroke="#94acbf"/><text x="54" y="174" class="head">拒发下一跳</text><text x="54" y="210" class="body">工具结果也会超限</text><text x="54" y="240" class="body">该次实际 HTTP 为 0</text><text x="54" y="270" class="body">保留已发生的调用</text><rect x="298" y="134" width="232" height="180" rx="14" fill="white" stroke="#94acbf"/><text x="314" y="174" class="head">结束或隔离旧轮</text><text x="314" y="210" class="body">QQ/CLI 等旧轮结束</text><text x="314" y="240" class="body">网页先失效隔离</text><text x="314" y="270" class="body">避免迟到结果串入</text><rect x="558" y="134" width="232" height="180" rx="14" fill="white" stroke="#94acbf"/><text x="574" y="174" class="head">保留持久结果</text><text x="574" y="210" class="body">任务与退款仍可查询</text><text x="574" y="240" class="body">已成功写入不回滚</text><text x="574" y="270" class="body">确认仍由宿主校验</text><rect x="818" y="134" width="232" height="180" rx="14" fill="white" stroke="#94acbf"/><text x="834" y="174" class="head">新会话重述</text><text x="834" y="210" class="body">明确订单与完整诉求</text><text x="834" y="240" class="body">重新授权读取事实</text><text x="834" y="270" class="body">网页须新建对话</text><text x="38" y="366" class="body">这里只验默认 atomic；Controller 的持久焦点清理是独立合同。</text></svg>