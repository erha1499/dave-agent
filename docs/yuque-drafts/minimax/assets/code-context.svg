<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420"><rect width="1100" height="420" fill="#f6f8fb"/><style>text{font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif;fill:#192d42} .title{font-size:28px;font-weight:600} .heading{font-size:21px;font-weight:600} .small{font-size:17px}</style><text x="38" y="58" class="title">代码上下文：每一步都回答一个问题</text><text x="38" y="96" class="small">按任务探索 → 读取当前版本 → 组合最小证据 → 修改后验证</text><rect x="38" y="138" width="232" height="182" rx="14" fill="white" stroke="#94acbf"/><text x="54" y="180" class="heading">确定问题</text><text x="54" y="217" class="small">真实目标与约束</text><text x="54" y="246" class="small">错误消息 / 业务名词</text><text x="54" y="275" class="small">固定仓库与版本</text><path d="M 273 230 h 17 l -5 -5 m 5 5 l -5 5" fill="none" stroke="#276c9c" stroke-width="2"/><rect x="298" y="138" width="232" height="182" rx="14" fill="white" stroke="#94acbf"/><text x="314" y="180" class="heading">定位候选</text><text x="314" y="217" class="small">关键词 / 符号优先</text><text x="314" y="246" class="small">语义检索补充线索</text><text x="314" y="275" class="small">AST / LSP 追结构</text><path d="M 533 230 h 17 l -5 -5 m 5 5 l -5 5" fill="none" stroke="#276c9c" stroke-width="2"/><rect x="558" y="138" width="232" height="182" rx="14" fill="white" stroke="#94acbf"/><text x="574" y="180" class="heading">补全证据</text><text x="574" y="217" class="small">读定义与调用者</text><text x="574" y="246" class="small">读异常路径与检查</text><text x="574" y="275" class="small">去重并预留预算</text><path d="M 793 230 h 17 l -5 -5 m 5 5 l -5 5" fill="none" stroke="#276c9c" stroke-width="2"/><rect x="818" y="138" width="232" height="182" rx="14" fill="white" stroke="#94acbf"/><text x="834" y="180" class="heading">执行与验证</text><text x="834" y="217" class="small">修改最小范围</text><text x="834" y="246" class="small">运行对应检查</text><text x="834" y="275" class="small">保留失败和局限</text><text x="38" y="373" class="small">相似片段不是行为证明；静态调用关系也不等于本次实际执行。</text></svg>