<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dave 客服 · 本地生活团购券</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="rail">
      <div class="brand">
        <svg class="ticket-mark" viewBox="0 0 44 44" aria-hidden="true" focusable="false">
          <path d="M10 7h24a3 3 0 0 1 3 3v7a3.5 3.5 0 0 0 0 8v7a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3v-7a3.5 3.5 0 0 0 0-8v-7a3 3 0 0 1 3-3Z" fill="#17243D"/>
          <path d="M28 10v24" stroke="#F2F5FA" stroke-width="1.6" stroke-dasharray="2.5 3"/>
          <text x="17" y="26.5" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">券</text>
        </svg>
        <div class="brand-text">
          <strong>Dave 客服</strong>
          <span>本地生活 · 团购券售后</span>
        </div>
      </div>
      <nav class="main-nav" aria-label="主导航">
        <a href="#" class="nav-item is-active" aria-current="page">客服问答</a>
        <a id="eval-link" class="nav-item" target="_blank" rel="noopener noreferrer" hidden>评测工作台</a>
      </nav>
      <p class="rail-note">模拟数据 · 只读咨询</p>
    </header>
    <main class="chat-panel">
      <header class="chat-header">
        <div class="chat-heading">
          <h1>客服问答</h1>
          <p class="chat-status" role="status" aria-live="polite" id="app-status"></p>
          <button type="button" id="init-retry" class="ghost-button" hidden>重试连接</button>
        </div>
        <div class="chat-controls">
          <label class="field-label" for="profile-select">演示客户</label>
          <select id="profile-select" disabled></select>
          <button type="button" id="new-chat" class="ghost-button" disabled>新对话</button>
        </div>
      </header>
      <section class="chat-scroll" id="chat-messages" aria-label="聊天记录" role="log" aria-live="polite" aria-relevant="additions">
        <div id="chat-empty" class="empty-state">
          <svg class="ticket-mark ticket-mark-lg" viewBox="0 0 44 44" aria-hidden="true" focusable="false">
            <circle cx="22" cy="22" r="21" fill="#E7EDFC"/>
            <path d="M10 7h24a3 3 0 0 1 3 3v7a3.5 3.5 0 0 0 0 8v7a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3v-7a3.5 3.5 0 0 0 0-8v-7a3 3 0 0 1 3-3Z" fill="#365DEB" transform="translate(3 3) scale(0.864)"/>
            <path d="M28 10v24" stroke="#E7EDFC" stroke-width="1.6" stroke-dasharray="2.5 3" transform="translate(3 3) scale(0.864)"/>
            <text x="17" y="26.5" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF" transform="translate(3 3) scale(0.864)">券</text>
          </svg>
          <p class="empty-title">有什么可以帮你？</p>
          <p class="empty-sub">咨询团购券使用、本人订单和到账规则。这里使用模拟数据。</p>
          <ul id="starter-list" class="starter-list"></ul>
        </div>
      </section>
      <form id="chat-form" class="composer">
        <label class="field-label" for="chat-input">你的问题</label>
        <textarea id="chat-input" maxlength="2000" rows="3" disabled placeholder="例如：团购券到期未使用，可以申请退款吗？"></textarea>
        <div class="composer-footer">
          <small class="key-note">Enter 发送 · Shift+Enter 换行</small>
          <span id="char-count" class="char-count">0/2000</span>
          <button type="submit" id="send-button" class="send-button" disabled>发送</button>
        </div>
      </form>
    </main>
    <aside class="sidebar" aria-label="会话信息">
      <section class="card config-card">
        <h2 class="card-title">当前配置</h2>
        <p class="settings-badge" id="active-settings">连接中…</p>
        <p class="sim-note">模拟环境 · 订单数据只读，回复不构成真实售后承诺。</p>
        <details id="chat-settings" class="settings-details">
          <summary>聊天设置</summary>
          <form id="settings-form" class="settings-form">
            <label class="field-label" for="model-select">模型</label>
            <select id="model-select" disabled></select>
            <label class="field-label" for="thinking-select">思考模式</label>
            <select id="thinking-select" disabled>
              <option value="off">关闭</option>
              <option value="high">开启</option>
            </select>
            <label class="field-label" for="tokens-select">输出上限（Token）</label>
            <select id="tokens-select" disabled>
              <option value="512">512</option>
              <option value="1024">1024</option>
              <option value="2048" selected>2048</option>
            </select>
            <button type="submit" id="apply-settings" class="ghost-button" disabled>应用并新建对话</button>
            <small class="field-note">应用后会清空当前对话。</small>
            <p role="status" aria-live="polite" id="settings-status" class="settings-status"></p>
          </form>
        </details>
      </section>
      <details class="card hints-card">
        <summary>订单提示</summary>
        <div id="order-hints"></div>
      </details>
    </aside>
  </div>
</body>
</html>
