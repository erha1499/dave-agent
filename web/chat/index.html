<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Dave Agent · 本地生活客服</title>
  <link rel="stylesheet" href="/ui.css">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body class="chat-page">
  <header class="masthead">
    <a class="brand" href="./" aria-label="Dave Agent 客服首页"><span class="brand-mark" aria-hidden="true">d.</span><div>Dave Agent <h1>本地生活客服</h1></div></a>
    <div class="header-meta"><button type="button" id="new-chat" class="quiet-button" disabled>新对话</button></div>
  </header>
  <main>
    <div class="toolbar">
      <nav class="tabs" aria-label="主导航">
        <a href="./" class="tab active" aria-current="page">客服问答</a>
        <a id="eval-link" class="tab" hidden>评测工作台</a>
      </nav>
      <label class="kind-filter" for="profile-select">客户 <select id="profile-select" disabled></select></label>
    </div>
    <div class="chat-layout">
      <section class="chat-main" aria-label="客服对话">
        <div class="panel chat-panel">
          <div class="panel-heading">
            <h3>客服问答</h3>
            <div class="chat-head-side">
              <p class="chat-status" role="status" aria-live="polite" id="app-status"></p>
              <button type="button" id="init-retry" class="quiet-button" hidden>重试连接</button>
            </div>
          </div>
          <section class="chat-scroll" id="chat-messages" aria-label="聊天记录" role="log" aria-live="polite" aria-relevant="additions">
            <div id="chat-empty" class="empty-state">
              <div class="message-avatar empty-avatar" aria-hidden="true">d.</div>
              <h2>有什么可以帮你？</h2>
              <p>咨询团购券使用、本人订单和到账规则。</p>
              <ul id="starter-list" class="starter-list"></ul>
            </div>
          </section>
          <form id="chat-form" class="composer">
            <label class="field-label" for="chat-input">你的问题</label>
            <textarea id="chat-input" maxlength="2000" rows="2" disabled placeholder="例如：我有哪些订单，或者我要退款"></textarea>
            <div class="composer-footer">
              <small class="key-note">Enter 发送 · Shift+Enter 换行</small>
              <span id="char-count" class="char-count">0/2000</span>
              <button type="submit" id="send-button" class="primary-button" disabled>发送</button>
            </div>
          </form>
        </div>
      </section>
      <aside class="chat-side" aria-label="会话信息">
        <section class="panel" aria-label="当前配置">
          <div class="panel-heading"><h3>当前配置</h3></div>
          <div class="side-body">
            <div id="active-settings" class="settings-snapshot">连接中…</div>
            <details id="chat-settings" class="settings-details">
              <summary>聊天设置</summary>
              <form id="settings-form" class="settings-form">
                <div class="exp-field"><label class="exp-field-label" for="model-select">模型</label><select id="model-select" disabled></select></div>
                <div class="exp-field"><label class="exp-field-label" for="thinking-select">思考模式</label><select id="thinking-select" disabled>
                  <option value="off">关闭</option>
                  <option value="high">开启</option>
                </select></div>
                <div class="exp-field"><label class="exp-field-label" for="tokens-select">输出上限（Token）</label><select id="tokens-select" disabled>
                  <option value="512">512</option>
                  <option value="1024">1024</option>
                  <option value="2048" selected>2048</option>
                </select></div>
                <button type="submit" id="apply-settings" class="primary-button" disabled>应用并新建对话</button>
                <small class="exp-note">应用后会清空当前对话。</small>
                <p role="status" aria-live="polite" id="settings-status" class="settings-status"></p>
              </form>
            </details>
          </div>
        </section>
        <details class="panel hints-panel">
          <summary>订单提示</summary>
          <div id="order-hints"></div>
        </details>
      </aside>
    </div>
  </main>
  <footer><span>团购券使用 · 本人订单 · 到账规则</span><span>Dave Agent · 本地生活客服</span></footer>
</body>
</html>
